name: status-overview

on:
  push:
    branches: [main]
    paths: [README.md, docs/drawbacks.txt, tools/status-overview.py]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/status-overview.py
      - name: Commit if changed
        run: |
          if ! git diff --quiet README.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
            git commit -am "README: refresh the status overview"
            git push
          fi
