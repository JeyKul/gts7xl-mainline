# The Bluetooth module starts GStreamer, whose Vulkan plugin hangs about 30 s early
# in boot; KDE's splash waits on PulseAudio meanwhile. Its only GStreamer codecs
# (LDAC, aptX) are not installed, so scan just the core sets, in a registry of its own.
[Service]
Environment=GST_PLUGIN_LOADING_WHITELIST=gstreamer:gst-plugins-base:gst-plugins-good
Environment=GST_REGISTRY_1_0=%h/.cache/gstreamer-1.0/pulseaudio.bin
